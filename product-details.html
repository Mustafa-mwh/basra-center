<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>تفاصيل المنتج - بصرة سنتر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cairo Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#26b559",
              secondary: "#F58220",
              background: "#fff",
              surface: "#FFFFFF",
              accent: "#F2F9F8",
            },
            fontFamily: {
              cairo: ["Cairo", "sans-serif"],
            },
            borderRadius: {
              xs: "8px",
              md: "16px",
              lg: "24px",
              xl: "32px",
            },
            boxShadow: {
              premium: "0 10px 20px -5px rgba(0, 0, 0, 0.05)",
              nav: "0 -10px 40px -10px rgba(0, 132, 119, 0.15)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Cairo", sans-serif;
        background-color: #fff;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }

      @media (min-width: 1024px) {
        body {
          background-image:
            radial-gradient(
              at 0% 0%,
              rgba(0, 132, 119, 0.068) 0px,
              transparent 50%
            ),
            radial-gradient(
              at 100% 0%,
              rgba(225, 105, 36, 0.089) 0px,
              transparent 50%
            ),
            radial-gradient(
              at 100% 100%,
              rgba(0, 132, 119, 0.05) 0px,
              transparent 50%
            ),
            radial-gradient(
              at 0% 100%,
              rgba(225, 105, 36, 0.158) 0px,
              transparent 50%
            );
          background-attachment: fixed;
        }
      }
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-up {
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .product-main-image {
        object-fit: contain;
        width: 100%;
        height: 100%;
        padding: 16px;
      }
      .product-card {
        width: 100%;
      }
      .product-card-horizontal {
        width: 41.86vw; /* 180px at 430px viewport */
        max-width: 180px;
      }
      .product-image-container {
        width: 100%;
        height: 52.09vw; /* 224px (h-56) at 430px viewport */
        max-height: 224px;
      }
      @media (min-width: 1024px) {
        .product-image-container {
          height: 224px;
        }
      }
      .product-image {
        object-fit: contain;
        width: 100%;
        height: 100%;
        padding: 8px;
      }

      .snackbar-container {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 70;
        width: min(100%, 380px);
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .snackbar-item {
        pointer-events: auto;
      }

      @keyframes snackbarIn {
        from {
          opacity: 0;
          transform: translateY(-20px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes snackbarOut {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateY(-10px) scale(0.95);
        }
      }
      .snackbar-enter {
        animation: snackbarIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .snackbar-exit {
        animation: snackbarOut 0.25s ease-in forwards;
      }
    </style>
  </head>
  <body class="pb-32 bg-transparent min-h-screen">
    <div
      class="max-w-5xl mx-auto bg-[#fbfbfb] min-h-screen relative overflow-hidden"
    >
      <!-- Header Controls -->
      <header
        class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-5xl p-5 flex items-center justify-between z-50"
      >
        <button
          onclick="window.history.back()"
          class="w-12 h-12 glass rounded-full flex items-center justify-center active:scale-90 transition-transform"
        >
          <i data-lucide="chevron-right" class="w-6 h-6 text-slate-800"></i>
        </button>
        <div class="flex gap-2">
          <button
            id="detail-like"
            onclick="toggleLike()"
            class="w-12 h-12 glass rounded-full flex items-center justify-center active:scale-90 transition-transform"
          >
            <i data-lucide="heart" class="w-6 h-6 text-slate-400"></i>
          </button>
          <button
            class="w-12 h-12 glass rounded-full flex items-center justify-center active:scale-90 transition-transform"
          >
            <i data-lucide="share-2" class="w-6 h-6 text-slate-800"></i>
          </button>
        </div>
      </header>

      <!-- Product Image Gallery -->
      <section class="relative">
        <div
          class="product-main-image flex items-center justify-center p-8 bg-white rounded-b-[48px] shadow-sm"
        >
          <img
            id="product-img"
            src=""
            class="max-h-full object-contain"
            alt="Product"
          />
        </div>
      </section>

      <!-- Product Info Content -->
      <main class="px-6 pt-8 animate-slide-up">
        <div id="subscription-context-badge" class="hidden mb-3 flex items-center gap-2 bg-primary/10 text-primary text-[11px] font-black px-4 py-2.5 rounded-2xl w-fit">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span id="subscription-context-text"></span>
        </div>

        <div class="flex items-center gap-2 mb-3">
          <span
            id="product-cat"
            class="bg-primary/10 text-primary text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider"
            >القسم</span
          >
          <span
            class="bg-secondary/10 text-secondary text-[10px] font-black px-3 py-1 rounded-full"
            >خصم 20%</span
          >
        </div>

        <h1
          id="product-name"
          class="text-2xl font-black text-slate-900 mb-6 leading-tight"
        >
          اسم المنتج يظهر هنا
        </h1>

        <div class="flex items-center gap-4 mb-8">
          <div class="flex flex-col">
            <span
              class="text-xs font-bold text-slate-400 uppercase tracking-widest"
              >السعر</span
            >
            <div class="flex items-baseline gap-1">
              <span id="product-price" class="text-xl font-black text-primary"
                >0,000</span
              >
              <span class="text-sm font-bold text-primary/60">د.ع</span>
            </div>
          </div>
          <div class="h-10 w-px bg-slate-100 mx-2"></div>
          <div class="flex flex-col">
            <span
              class="text-xs font-bold text-slate-400 uppercase tracking-widest"
              >التوافر</span
            >
            <span
              id="product-availability"
              class="text-sm font-black text-emerald-600"
              >متوفر في المخزن</span
            >
          </div>
        </div>

        <!-- Details (Always Visible) -->
        <div class="animate-slide-up mb-10">
          <h3 class="text-base font-black text-slate-900 mb-4 px-1">
            التفاصيل
          </h3>
          <p id="product-desc" class="text-slate-500 mb-8 leading-relaxed px-1">
            هذا الوصف يعبر عن تفاصيل المنتج ومميزاته التي تهم المستخدم.
          </p>
        </div>

        <!-- Similar Products Section -->
        <section id="similar-section" class="mt-4 mb-24 animate-slide-up">
          <div class="flex items-center justify-between mb-5 px-1">
            <h3 class="text-lg font-black text-slate-900">منتجات مشابهة</h3>
          </div>
          <div
            id="similar-products"
            class="flex overflow-x-auto gap-4 hide-scrollbar pb-6 px-1"
          >
            <!-- Populated via JS -->
          </div>
        </section>
      </main>

      <!-- Floating Cart Bar -->
      <div
        id="floating-cart-bar"
        class="hidden fixed left-1/2 -translate-x-1/2 w-full max-w-5xl px-6 z-[60] transition-all duration-300 pointer-events-none"
        style="bottom: 100px"
      >
        <div class="pointer-events-auto max-w-md mx-auto">
          <button
            onclick="window.location.href = cartViewHref()"
            class="w-full bg-white/95 backdrop-blur-md rounded-2xl p-4 border border-slate-100 flex flex-col gap-3 shadow-premium active:scale-[0.98] transition-all animate-fade-in"
          >
            <!-- Reward Progress Section -->
            <div class="w-full flex flex-col gap-1.5">
              <div
                class="flex justify-between items-center text-[10px] font-black"
              >
                <span id="reward-message" class="text-primary"
                  >باقي 50,000 د.ع للحصول على توصيل مجاني</span
                >
                <span id="reward-percent" class="text-slate-400">0%</span>
              </div>
              <div
                class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden"
              >
                <div
                  id="reward-progress"
                  class="h-full bg-primary rounded-full transition-all duration-700"
                  style="width: 0%"
                ></div>
              </div>
            </div>

            <!-- Divider -->
            <div class="w-full h-px bg-slate-50"></div>

            <!-- Main Content Section -->
            <div class="flex items-center justify-between w-full">
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl flex items-center justify-center bg-primary text-white shadow-sm shrink-0"
                >
                  <i data-lucide="shopping-basket" class="w-5 h-5"></i>
                </div>
                <div class="flex flex-col items-start leading-none gap-1">
                  <span class="text-[11px] font-black text-slate-900"
                    >سلة التسوق</span
                  >
                  <span
                    id="floating-cart-count"
                    class="text-[10px] font-bold text-slate-400"
                    >0 منتج</span
                  >
                </div>
              </div>

              <div class="flex items-center gap-3">
                <span
                  id="floating-cart-total"
                  class="text-sm font-black text-primary"
                  >0 د.ع</span
                >
                <div
                  class="w-8 h-8 bg-slate-50 rounded-lg flex items-center justify-center text-slate-400 border border-slate-100"
                >
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </div>
              </div>
            </div>
          </button>
        </div>
      </div>

      <!-- Bottom Action Bar -->
      <div
        class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-5xl p-6 z-50"
      >
        <nav
          id="detail-action-bar"
          class="max-w-md mx-auto glass rounded-[32px] p-2 flex items-center justify-between gap-4 shadow-nav border border-white/60 pointer-events-auto"
        >
          <!-- Qty Selector -->
          <div
            id="detail-qty-group"
            class="flex items-center gap-3 bg-slate-50 p-1.5 rounded-2xl border border-slate-100"
          >
            <button
              onclick="changeQty(-1)"
              class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-slate-400 shadow-sm active:scale-90"
            >
              <i data-lucide="minus" class="w-5 h-5"></i>
            </button>
            <span
              id="qty-count"
              class="text-lg font-black min-w-[24px] text-center"
              >1</span
            >
            <button
              onclick="changeQty(1)"
              class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-primary shadow-sm active:scale-90"
            >
              <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Add / Notify Button -->
          <button
            id="detail-action-btn"
            onclick="handleDetailAction()"
            class="flex-1 h-14 bg-primary text-white rounded-2xl font-black text-md shadow-lg shadow-primary/25 active:scale-[0.98] transition-transform flex items-center justify-center gap-3"
          >
            <i data-lucide="shopping-cart" class="w-6 h-6"></i>
            إضافة
          </button>
        </nav>
      </div>

      <div id="snackbar-container" class="snackbar-container"></div>

      <script>
        // Data Loading
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get("id") || "p1";
        const subId = urlParams.get("sub") || "general"; // which cart bucket this page reads/writes
        let currentProduct = null;
        let allCarts = { general: {} }; // full carts store, kept in sync with localStorage "carts"
        let cart = {}; // reference into allCarts[subId]
        let likes = {};
        window.appSections = [];
        window.appSubscriptions = [];

        function detailHref(id) {
          return subId === "general"
            ? `product-details.html?id=${id}`
            : `product-details.html?id=${id}&sub=${subId}`;
        }

        function cartViewHref() {
          return subId === "general" ? "index.html?view=cart" : `index.html?view=cart&sub=${subId}`;
        }

        function saveCarts() {
          localStorage.setItem("carts", JSON.stringify(allCarts));
        }

        // Snackbar Configuration
        const SNACKBAR_CONFIG = {
          success: {
            icon: "check-circle-2",
            title: "تمت العملية بنجاح",
            message: "تم تنفيذ العملية بشكل صحيح",
            bg: "bg-white",
            border: "border-emerald-500",
            iconBg: "bg-emerald-50",
            iconColor: "text-emerald-500",
            titleColor: "text-slate-900",
            msgColor: "text-slate-500",
            barColor: "bg-emerald-500",
            action: "",
            actionColor: "text-emerald-600",
          },
          error: {
            icon: "x-circle",
            title: "حدث خطأ ما",
            message: "لم نتمكن من تنفيذ العملية، حاول مجدداً",
            bg: "bg-white",
            border: "border-rose-500",
            iconBg: "bg-rose-50",
            iconColor: "text-rose-500",
            titleColor: "text-slate-900",
            msgColor: "text-slate-500",
            barColor: "bg-rose-500",
            action: "",
            actionColor: "text-rose-600",
          },
          warning: {
            icon: "alert-triangle",
            title: "تنبيه",
            message: "تأكد من صحة البيانات قبل المتابعة",
            bg: "bg-white",
            border: "border-amber-500",
            iconBg: "bg-amber-50",
            iconColor: "text-amber-500",
            titleColor: "text-slate-900",
            msgColor: "text-slate-500",
            barColor: "bg-amber-500",
            action: "",
            actionColor: "text-amber-600",
          },
          info: {
            icon: "info",
            title: "معلومة جديدة",
            message: "لديك تحديث متاح، تحقق من المستجدات",
            bg: "bg-white",
            border: "border-blue-500",
            iconBg: "bg-blue-50",
            iconColor: "text-blue-500",
            titleColor: "text-slate-900",
            msgColor: "text-slate-500",
            barColor: "bg-blue-500",
            action: "",
            actionColor: "text-blue-600",
          },
          notify: {
            icon: "bell",
            title: "سيصلك إشعار",
            message: "سنبلغك فور توفر المنتج مجدداً",
            bg: "bg-white",
            border: "border-primary",
            iconBg: "bg-primary/10",
            iconColor: "text-primary",
            titleColor: "text-slate-900",
            msgColor: "text-slate-500",
            barColor: "bg-primary",
            action: "",
            actionColor: "text-primary",
          },
        };

        let snackbarTimer = null;

        async function loadProduct() {
          try {
            const response = await fetch("data.json");
            const data = await response.json();
            window.appSections = data.sections;
            window.appSubscriptions = data.subscriptions || [];

            // Load state from local storage
            const legacyCart = localStorage.getItem("cart");
            allCarts = JSON.parse(
              localStorage.getItem("carts") || (legacyCart ? `{"general":${legacyCart}}` : '{"general":{}}'),
            );
            if (!allCarts[subId]) allCarts[subId] = {};
            cart = allCarts[subId];
            likes = JSON.parse(localStorage.getItem("likes") || "{}");

            if (subId !== "general") {
              const sub = window.appSubscriptions.find((s) => s.id === subId);
              const badge = document.getElementById("subscription-context-badge");
              const badgeText = document.getElementById("subscription-context-text");
              if (sub && badge && badgeText) {
                badgeText.innerText = `يُضاف إلى سلة اشتراك: ${sub.name}`;
                badge.classList.remove("hidden");
              }
            }

            // Find product across all sections
            data.sections.forEach((s) => {
              const p = s.products.find((item) => item.id === productId);
              if (p) {
                currentProduct = p;
                currentProduct.cat = s.title;
              }
            });

            if (currentProduct) {
              document.getElementById("product-name").innerText =
                currentProduct.name;
              document.getElementById("product-price").innerText =
                currentProduct.price;
              document.getElementById("product-desc").innerText =
                currentProduct.fullDesc || currentProduct.desc;
              document.getElementById("product-cat").innerText =
                currentProduct.cat;
              document.getElementById("product-img").src = currentProduct.img;

              renderSimilarProducts(
                data.sections,
                currentProduct.id,
                currentProduct.cat,
              );
              updateLikeUI(likes[productId]);
              updateCartUI();
              updateDetailActionUI();
              lucide.createIcons();
            }
          } catch (error) {
            console.error("Error loading product data:", error);
          }
        }

        function updateLikeUI(active) {
          const btn = document.getElementById("detail-like");
          const icon = btn.querySelector("svg") || btn.querySelector("i");
          if (active) {
            icon.classList.remove("text-slate-400");
            icon.classList.add("text-red-500", "fill-red-500");
          } else {
            icon.classList.remove("text-red-500", "fill-red-500");
            icon.classList.add("text-slate-400");
          }
        }

        function updateCartUI() {
          const qty = cart[productId] || 1;
          document.getElementById("qty-count").innerText = qty;
          updateFloatingCartBar();
          updateDetailActionUI();
        }

        async function updateFloatingCartBar() {
          const floatingBar = document.getElementById("floating-cart-bar");
          if (!floatingBar) return;

          const cartItems = Object.keys(cart);
          const totalProducts = cartItems.reduce(
            (sum, id) => sum + cart[id],
            0,
          );

          if (totalProducts === 0) {
            floatingBar.classList.add("hidden");
            return;
          }

          try {
            const response = await fetch("data.json");
            const data = await response.json();

            let allProducts = [];
            data.sections.forEach(
              (s) => (allProducts = [...allProducts, ...s.products]),
            );

            let subtotal = 0;
            cartItems.forEach((id) => {
              const p = allProducts.find((item) => item.id === id) || {
                price: "0",
              };
              const priceNum = parseInt(p.price.replace(/,/g, ""));
              subtotal += priceNum * cart[id];
            });

            document.getElementById("floating-cart-count").innerText =
              `${totalProducts} منتج`;
            document.getElementById("floating-cart-total").innerText =
              `${subtotal.toLocaleString()} د.ع`;

            // Reward Progress Logic
            const threshold = 50000;
            const progress = Math.min((subtotal / threshold) * 100, 100);
            const remaining = Math.max(threshold - subtotal, 0);

            const progressEl = document.getElementById("reward-progress");
            const messageEl = document.getElementById("reward-message");
            const percentEl = document.getElementById("reward-percent");

            if (progressEl) progressEl.style.width = `${progress}%`;
            if (percentEl) percentEl.innerText = `${Math.round(progress)}%`;

            if (messageEl) {
              if (remaining > 0) {
                messageEl.innerText = `باقي ${remaining.toLocaleString()} د.ع للحصول على توصيل مجاني`;
                messageEl.classList.replace("text-amber-500", "text-primary");
              } else {
                messageEl.innerText = "مبروك! حصلت على توصيل مجاني";
                messageEl.classList.replace("text-primary", "text-amber-500");
              }
            }

            floatingBar.classList.remove("hidden");
          } catch (e) {
            console.error("Error updating cart bar", e);
          }
        }

        function changeQty(delta) {
          let qty = cart[productId] || 1;
          qty = Math.max(1, qty + delta);
          cart[productId] = qty;
          saveCarts();
          updateCartUI();
        }

        function addToCart() {
          if (currentProduct && currentProduct.stock === 0) {
            notifyWhenAvailable(productId);
            return;
          }

          if (!cart[productId]) cart[productId] = 1;
          saveCarts();
          window.location.href = cartViewHref();
        }

        function handleDetailAction() {
          if (currentProduct && currentProduct.stock === 0) {
            notifyWhenAvailable(productId);
          } else {
            addToCart();
          }
        }

        function updateDetailActionUI() {
          const actionBtn = document.getElementById("detail-action-btn");
          const qtyGroup = document.getElementById("detail-qty-group");
          const availabilityText = document.getElementById(
            "product-availability",
          );

          if (!actionBtn || !qtyGroup || !availabilityText || !currentProduct)
            return;

          const isSoldOut = currentProduct.stock === 0;

          const actionBar = document.getElementById("detail-action-bar");

          if (isSoldOut) {
            availabilityText.innerText = "نفذت الكمية";
            availabilityText.className = "text-sm font-black text-rose-500";
            qtyGroup.classList.add("hidden");
            if (actionBar) {
              actionBar.classList.remove(
                "glass",
                "shadow-nav",
                "border",
                "border-white/60",
              );
              actionBar.classList.add("bg-transparent", "shadow-none");
            }
            actionBtn.innerHTML = `<i data-lucide="bell" class="w-6 h-6"></i> أبلغني عند التوفر`;
            actionBtn.classList.remove("bg-primary", "text-white");
            actionBtn.classList.add(
              "bg-white",
              "text-primary",
              "border",
              "border-primary/20",
            );
            actionBtn.onclick = () => notifyWhenAvailable(productId);
          } else {
            availabilityText.innerText = "متوفر في المخزن";
            availabilityText.className = "text-sm font-black text-emerald-600";
            qtyGroup.classList.remove("hidden");
            if (actionBar) {
              actionBar.classList.add(
                "glass",
                "shadow-nav",
                "border",
                "border-white/60",
              );
              actionBar.classList.remove("bg-transparent", "shadow-none");
            }
            actionBtn.innerHTML = `<i data-lucide="shopping-cart" class="w-6 h-6"></i> إضافة`;
            actionBtn.classList.remove(
              "bg-white",
              "text-primary",
              "border",
              "border-primary/20",
            );
            actionBtn.classList.add("bg-primary", "text-white");
            actionBtn.onclick = handleDetailAction;
          }

          lucide.createIcons();
        }

        function notifyWhenAvailable(id) {
          const product = window.appSections
            .flatMap((section) => section.products)
            .find((item) => item.id === id);

          const productName = product ? product.name : "المنتج";
          showSnackbar("notify", `سنبلغك فور توفر ${productName} مجدداً`);
        }

        function showSnackbar(type, customMessage = "") {
          const cfg = SNACKBAR_CONFIG[type];
          if (!cfg) return;

          const container = document.getElementById("snackbar-container");
          const existing = container.querySelector(".snackbar-item");
          if (existing) {
            existing.classList.remove("snackbar-enter");
            existing.classList.add("snackbar-exit");
            setTimeout(() => existing.remove(), 250);
          }
          if (snackbarTimer) clearTimeout(snackbarTimer);

          const id = "snackbar-" + Date.now();
          const snackbar = document.createElement("div");
          snackbar.id = id;
          snackbar.className = `snackbar-item snackbar-enter pointer-events-auto w-full max-w-sm mx-auto`;
          snackbar.innerHTML = `
            <div class="relative ${cfg.bg} rounded-[10px] shadow-[0_8px_32px_-8px_rgba(0,0,0,0.18)] overflow-hidden">
              <div class="flex items-start gap-3 px-4 pt-4 pb-3">
                <div class="${cfg.barColor} w-[4px] rounded-lg self-stretch mx-2"></div>
                <div class="flex-1 min-w-0">
                  <span class="text-sm font-black ${cfg.titleColor} block leading-tight">${cfg.title}</span>
                  <span class="text-[11px] font-bold ${cfg.msgColor} block mt-0.5 leading-snug">${customMessage || cfg.message}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-1">
                  <button onclick="dismissSnackbar('${id}')" class="text-[10px] font-black ${cfg.actionColor} active:opacity-70 transition-opacity">
                    ${cfg.action}
                  </button>
                  <button onclick="dismissSnackbar('${id}')" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center justify-center transition-colors">
                    <i data-lucide="x" class="w-3 h-3 text-slate-500"></i>
                  </button>
                </div>
              </div>
            </div>
          `;

          container.appendChild(snackbar);
          lucide.createIcons({ nodes: [snackbar] });

          snackbarTimer = setTimeout(() => dismissSnackbar(id), 4000);
        }

        function dismissSnackbar(id) {
          const el = document.getElementById(id);
          if (!el) return;
          el.classList.remove("snackbar-enter");
          el.classList.add("snackbar-exit");
          setTimeout(() => el && el.remove(), 260);
        }

        function toggleLike() {
          likes[productId] = !likes[productId];
          localStorage.setItem("likes", JSON.stringify(likes));
          updateLikeUI(likes[productId]);
        }

        function changeQtyId(id, delta) {
          let qty = cart[id] || 0;
          qty = Math.max(0, qty + delta);
          if (qty === 0) delete cart[id];
          else cart[id] = qty;
          saveCarts();
          updateFloatingCartBar();
          if (window.appSections)
            renderSimilarProducts(
              window.appSections,
              productId,
              currentProduct.cat,
            );
          lucide.createIcons();
        }

        function addToCartId(id) {
          if (!cart[id]) cart[id] = 1;
          saveCarts();
          updateFloatingCartBar();
          if (window.appSections)
            renderSimilarProducts(
              window.appSections,
              productId,
              currentProduct.cat,
            );
          lucide.createIcons();
        }

        function toggleLikeId(id) {
          likes[id] = !likes[id];
          localStorage.setItem("likes", JSON.stringify(likes));
          if (window.appSections)
            renderSimilarProducts(
              window.appSections,
              productId,
              currentProduct.cat,
            );
          lucide.createIcons();
        }

        function renderSimilarProducts(sections, currentId, categoryTitle) {
          const section = sections.find((s) => s.title === categoryTitle);
          if (!section) return;

          const similar = section.products
            .filter((p) => p.id !== currentId)
            .slice(0, 6);
          const container = document.getElementById("similar-products");
          const sectionEl = document.getElementById("similar-section");

          if (similar.length === 0) {
            sectionEl.classList.add("hidden");
            return;
          }

          container.innerHTML = similar
            .map(
              (p, i) => `
            <div class="product-card product-card-horizontal lg:w-full bg-transparent rounded-[28px] shrink-0 lg:shrink relative animate-fade-in flex flex-col" style="animation-delay: ${i * 0.1}s">
              ${p.discount ? `<div class="absolute top-2.5 right-2.5 z-10"><span class="bg-secondary text-white text-[9px] font-black px-2 py-1 rounded-lg">خصم ${p.discount}</span></div>` : ""}
              <button onclick="event.stopPropagation(); toggleLikeId('${p.id}')" data-id="${p.id}" class="like-btn absolute top-2.5 left-2.5 z-20 w-8 h-8 glass rounded-full flex items-center justify-center transition-all active:scale-90">
                <i data-lucide="heart" class="w-4 h-4 ${likes[p.id] ? "text-red-500 fill-red-500" : "text-slate-400"}"></i>
              </button>
              
              <div onclick="window.location.href='${detailHref(p.id)}'" class="w-full product-image-container lg:h-56 rounded-[22px] mb-3 overflow-hidden cursor-pointer relative group">
                <img src="${p.img}" class="product-image bg-white w-full h-full object-contain border border-slate-200 rounded-lg" alt="${p.name}">
                
                <div data-id="${p.id}" class="controls-container absolute bottom-2.5 right-2.5 z-20">
                  <button onclick="event.stopPropagation(); addToCartId('${p.id}')" class="w-9 h-9 bg-primary text-white rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 active:scale-90 transition-transform ${cart[p.id] > 0 ? "hidden" : ""}">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                  </button>
                  <div data-id="${p.id}" class="selector-container ${cart[p.id] > 0 ? "flex" : "hidden"} items-center gap-1.5 bg-white/90 backdrop-blur-md rounded-xl p-1 animate-fade-in border border-slate-200">
                    <button onclick="event.stopPropagation(); changeQtyId('${p.id}', 1)" class="w-7 h-7 bg-white rounded-lg flex items-center justify-center shadow-sm text-primary active:scale-90">
                      <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                    <span data-id="${p.id}" class="qty-text text-xs font-black px-1 min-w-[12px] text-center">${cart[p.id] || 1}</span>
                    <button onclick="event.stopPropagation(); changeQtyId('${p.id}', -1)" class="w-7 h-7 bg-white rounded-lg flex items-center justify-center shadow-sm text-slate-400 active:scale-90">
                      <i data-lucide="minus" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="px-3 pb-3 flex-1 flex flex-col">
                <h4 onclick="window.location.href='${detailHref(p.id)}'" class="text-[10px] lg:text-[12px] text-slate-900 truncate mb-1 cursor-pointer hover:text-primary transition-colors">${p.name}</h4>
                <p class="text-[10px] text-slate-400 mb-2">${p.desc || "وحدة واحدة"}</p>
                <div class="">
                  <span class="text-sm text-slate-900">${p.price} <span class="text-[10px] opacity-40 font-bold">د.ع</span></span>
                </div>
              </div>
            </div>
          `,
            )
            .join("");
        }

        window.onload = loadProduct;
      </script>
    </div>
  </body>
</html>
